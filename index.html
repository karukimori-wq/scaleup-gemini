<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINEスタンプ・クッキリ変換器 mini</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-6 px-4">

  <div class="max-w-md mx-auto bg-white shadow-lg rounded-2xl overflow-hidden border border-slate-100">
    <div class="bg-slate-900 p-5 text-center text-white">
      <h1 class="text-xl font-bold">スタンプクッキリ変換器</h1>
      <p class="text-xs text-slate-400 mt-1">スマホのブラウザ内で超高速・安全処理</p>
    </div>

    <div class="p-6">
      <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-6 bg-slate-50 relative min-h-[120px]">
        <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
        <p class="text-sm font-medium text-slate-600 text-center">タップしてスタンプ画像を選択</p>
        <p class="text-xs text-slate-400 mt-1">※自動でLINE既定サイズに収めます</p>
      </div>

      <div id="resultArea" class="mt-6 space-y-6 hidden">
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex flex-col items-center">
          <h3 class="text-xs font-semibold text-blue-600 mb-2 uppercase tracking-wider">変換後（高画質・クッキリ化）</h3>
          <div class="bg-white p-2 rounded-lg shadow-inner border border-slate-200 flex items-center justify-center">
            <canvas id="outputCanvas" class="max-w-full h-auto object-contain"></canvas>
          </div>
          <button id="downloadBtn" class="mt-4 w-full bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm text-sm active:bg-blue-700">
            高画質画像を保存
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const resultArea = document.getElementById('resultArea');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          processImage(img);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function processImage(img) {
      // 1. LINEスタンプサイズ（最大370x320）にアスペクト比を維持して計算
      const maxW = 370;
      const maxH = 320;
      let width = img.width;
      let height = img.height;

      if (width > maxW || height > maxH) {
        const ratio = Math.min(maxW / width, maxH / height);
        width = Math.floor(width * ratio);
        height = Math.floor(height * ratio);
      }

      // LINE規定の「偶数ピクセル」に調整
      canvas.width = width % 2 === 0 ? width : width - 1;
      canvas.height = height % 2 === 0 ? height : height - 1;

      // 2. 高精度リサイズ（Canvasに描画）
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // 3. 輪郭クッキリ化（シャープネス・フィルター処理）
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const originalData = new Uint8ClampedArray(data);

      const w = canvas.width;
      const h = canvas.height;

      // 畳み込みマトリクス（強力な輪郭強調フィルター）
      const weights = [
         0, -1,  0,
        -1,  5, -1,
         0, -1,  0
      ];
      const side = 3;
      const halfSide = 1;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const sy = y;
          const sx = x;
          const dstOff = (y * w + x) * 4;

          let r = 0, g = 0, b = 0;
          for (let cy = 0; cy < side; cy++) {
            for (let cx = 0; cx < side; cx++) {
              const scy = Math.min(h - 1, Math.max(0, sy + cy - halfSide));
              const scx = Math.min(w - 1, Math.max(0, sx + cx - halfSide));
              const srcOff = (scy * w + scx) * 4;
              const wt = weights[cy * side + cx];
              r += originalData[srcOff] * wt;
              g += originalData[srcOff + 1] * wt;
              b += originalData[srcOff + 2] * wt;
            }
          }
          data[dstOff] = Math.min(255, Math.max(0, r));
          data[dstOff + 1] = Math.min(255, Math.max(0, g));
          data[dstOff + 2] = Math.min(255, Math.max(0, b));
          // 透明度（Alpha）はそのまま維持
          data[dstOff + 3] = originalData[dstOff + 3];
        }
      }

      ctx.putImageData(imageData, 0, 0);
      resultArea.classList.remove('hidden');
    }

    // 保存ボタンの処理
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'line-stamp-sharp.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
