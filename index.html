<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINEスタンプ AI超解像・高画質化</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">

  <div class="max-w-md mx-auto bg-slate-800 shadow-2xl rounded-2xl overflow-hidden border border-slate-700">
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-center text-white">
      <h1 class="text-2xl font-bold tracking-wide">スタンプ AI高画質化</h1>
      <p class="text-xs text-blue-100 mt-1">Real-ESRGAN AIモデルが線を滑らかに復元</p>
    </div>

    <div class="p-6 space-y-6">
      <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 rounded-xl p-6 bg-slate-850 hover:bg-slate-750 relative min-h-[140px] transition-colors">
        <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
        <span class="text-3xl mb-2">📸</span>
        <p class="text-sm font-medium text-slate-300 text-center">タップして画像を選択</p>
        <p class="text-xs text-slate-500 mt-1">AIがボケた線を自動でクッキリ化します</p>
      </div>

      <div id="loadingArea" class="hidden text-center py-8">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-3"></div>
        <p class="text-sm text-slate-400">AIがイラストを解析・クッキリ化中...</p>
        <p class="text-xs text-slate-500 mt-1">（初回のみAIの起動に30秒ほどかかる場合があります）</p>
      </div>

      <div id="resultArea" class="space-y-4 hidden">
        <div class="bg-slate-850 p-4 rounded-xl border border-slate-700 flex flex-col items-center">
          <h3 class="text-xs font-semibold text-blue-400 mb-3 uppercase tracking-wider">✨ AI変換後の画像</h3>
          <div class="bg-slate-950 p-2 rounded-lg border border-slate-800 flex items-center justify-center max-h-[300px] overflow-hidden">
            <img id="outputImage" class="max-w-full max-h-[260px] object-contain" alt="AI処理結果" />
          </div>
          <button id="downloadBtn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-lg text-sm active:scale-98 transition-transform">
            高画質画像を保存する
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const loadingArea = document.getElementById('loadingArea');
    const resultArea = document.getElementById('resultArea');
    const outputImage = document.getElementById('outputImage');
    const downloadBtn = document.getElementById('downloadBtn');

    // イラスト特化型の超有名AIモデル（Real-ESRGAN）の配信URLを利用
    const API_URL = "https://api-inference.huggingface.co/models/gokaygokay/Real-ESRGAN";

    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // 画面の表示切り替え
      loadingArea.classList.remove('hidden');
      resultArea.classList.add('hidden');

      try {
        // AI APIに画像を送信
        const response = await fetch(API_URL, {
          method: "POST",
          body: file,
        });

        if (!response.ok) {
          throw new Error("AIサーバーが混雑しています。少し待って再度お試しください。");
        }

        // 返ってきた高画質バイナリデータを画像URLに変換
        const blob = await response.blob();
        const resultUrl = URL.createObjectURL(blob);
        
        // 画面に表示
        outputImage.src = resultUrl;
        loadingArea.classList.add('hidden');
        resultArea.classList.remove('hidden');

        // 保存ボタンの設定
        downloadBtn.onclick = () => {
          const link = document.createElement('a');
          link.href = resultUrl;
          link.download = 'ai-stamp-highres.png';
          link.click();
        };

      } catch (error) {
        alert(error.message);
        loadingArea.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
